<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard de Control · Censo INDUPOX Set v2.0</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Iconos Lucide -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      background: #060911;
      justify-content: flex-start;
    }
    .desktop-container {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .dashboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-card);
      border: 1px solid var(--glass-border);
      padding: 20px 28px;
      border-radius: var(--radius-lg);
      backdrop-filter: blur(16px);
    }
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
    }
    .kpi-card {
      background: var(--bg-card);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-md);
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .kpi-icon {
      width: 48px;
      height: 48px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }
    .kpi-val {
      font-family: var(--font-heading);
      font-size: 1.8rem;
      font-weight: 700;
    }
    .kpi-label {
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    .table-card {
      background: var(--bg-card);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      padding: 24px;
    }
    .table-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .search-box {
      flex: 1;
      min-width: 260px;
      position: relative;
    }
    .search-box input {
      width: 100%;
      padding: 10px 14px 10px 38px;
      background: rgba(10, 15, 26, 0.8);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-md);
      color: #fff;
      font-size: 0.9rem;
    }
    .search-box i {
      position: absolute;
      left: 12px; top: 11px;
      color: var(--text-muted);
    }
    .filter-pills {
      display: flex;
      gap: 8px;
    }
    .pill {
      padding: 8px 14px;
      border-radius: var(--radius-full);
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--glass-border);
      color: var(--text-muted);
      font-size: 0.82rem;
      cursor: pointer;
    }
    .pill.active {
      background: var(--accent-primary);
      color: #fff;
    }
    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.88rem;
    }
    .data-table th {
      text-align: left;
      padding: 12px 16px;
      background: rgba(10, 15, 26, 0.7);
      color: var(--text-muted);
      font-weight: 600;
      border-bottom: 1px solid var(--glass-border);
    }
    .data-table td {
      padding: 14px 16px;
      border-bottom: 1px solid var(--glass-border);
      vertical-align: middle;
    }
    .data-table tr:hover {
      background: rgba(255, 255, 255, 0.03);
    }
    .tag-type {
      display: inline-block;
      padding: 3px 10px;
      border-radius: var(--radius-full);
      font-size: 0.72rem;
      font-weight: 600;
    }
    .tag-operativa { background: rgba(6, 182, 212, 0.2); color: var(--accent-secondary); }
    .tag-identidad { background: rgba(16, 185, 129, 0.2); color: var(--accent-success); }
    .tag-condicionada { background: rgba(245, 158, 11, 0.2); color: var(--accent-warning); }
    .tag-otro { background: rgba(148, 163, 184, 0.2); color: var(--text-muted); }
  </style>
</head>
<body>
  <div class="desktop-container">
    
    <!-- Header -->
    <header class="dashboard-header">
      <div class="brand">
        <div class="brand-icon">
          <i data-lucide="layers"></i>
        </div>
        <div>
          <h1>INDUPOX · Censo de Objetos Set v2.0</h1>
          <span class="status-badge">
            <span class="status-dot"></span> <span>Superficie de Consulta en Vivo</span>
          </span>
        </div>
      </div>
      
      <div style="display: flex; gap: 10px;">
        <button id="refresh-btn" class="btn btn-secondary">
          <i data-lucide="refresh-cw"></i> Actualizar
        </button>
        <button id="export-csv-btn" class="btn btn-primary">
          <i data-lucide="download"></i> Exportar CSV
        </button>
      </div>
    </header>

    <!-- KPIs -->
    <section class="kpi-grid">
      <div class="kpi-card">
        <div class="kpi-icon" style="background: var(--accent-primary);">
          <i data-lucide="qr-code"></i>
        </div>
        <div>
          <div class="kpi-val" id="kpi-total">0</div>
          <div class="kpi-label">Lecturas Sincronizadas</div>
        </div>
      </div>

      <div class="kpi-card">
        <div class="kpi-icon" style="background: var(--accent-secondary);">
          <i data-lucide="flask-conical"></i>
        </div>
        <div>
          <div class="kpi-val" id="kpi-operativas">0</div>
          <div class="kpi-label">Etiquetas Operativas (70x50)</div>
        </div>
      </div>

      <div class="kpi-card">
        <div class="kpi-icon" style="background: var(--accent-success);">
          <i data-lucide="tag"></i>
        </div>
        <div>
          <div class="kpi-val" id="kpi-identidad">0</div>
          <div class="kpi-label">Etiquetas de Identidad (50x20)</div>
        </div>
      </div>
    </section>

    <!-- Tabla Principal de Consulta -->
    <section class="table-card">
      <div class="table-toolbar">
        <div class="search-box">
          <i data-lucide="search"></i>
          <input type="text" id="search-input" placeholder="Buscar por código (M04, P05, U38AC), descripción o formulación...">
        </div>

        <div class="filter-pills">
          <button class="pill active" data-filter="all">Todos</button>
          <button class="pill" data-filter="OPERATIVA">Operativas</button>
          <button class="pill" data-filter="IDENTIDAD">Identidad</button>
        </div>
      </div>

      <div style="overflow-x: auto;">
        <table class="data-table">
          <thead>
            <tr>
              <th>Código</th>
              <th>Tipo</th>
              <th>Nombre de Objeto / Fórmula</th>
              <th>Corrida / Formulación</th>
              <th>EPP & Seguridad</th>
              <th>Fecha / Hora</th>
            </tr>
          </thead>
          <tbody id="table-body">
            <!-- Renderizado dinámico desde JS -->
          </tbody>
        </table>
      </div>
    </section>

  </div>

  <script>
    let allScans = [];
    let currentFilter = 'all';

    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      fetchScans();
      setInterval(fetchScans, 4000); // Polling automático cada 4 segundos

      document.getElementById('refresh-btn').addEventListener('click', fetchScans);
      document.getElementById('export-csv-btn').addEventListener('click', exportCSV);

      document.getElementById('search-input').addEventListener('input', renderTable);

      document.querySelectorAll('.pill').forEach(pill => {
        pill.addEventListener('click', () => {
          document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
          pill.classList.add('active');
          currentFilter = pill.getAttribute('data-filter');
          renderTable();
        });
      });
    });

    async function fetchScans() {
      try {
        const res = await fetch('/api/scans');
        allScans = await res.json();
        updateKPIs();
        renderTable();
      } catch (err) {
        console.error("Error al cargar escaneos:", err);
      }
    }

    function updateKPIs() {
      document.getElementById('kpi-total').innerText = allScans.length;
      const operativas = allScans.filter(s => s.tipo && s.tipo.includes('OPERATIVA')).length;
      const identidad = allScans.filter(s => s.tipo && s.tipo.includes('IDENTIDAD')).length;

      document.getElementById('kpi-operativas').innerText = operativas;
      document.getElementById('kpi-identidad').innerText = identidad;
    }

    function renderTable() {
      const body = document.getElementById('table-body');
      const query = document.getElementById('search-input').value.toLowerCase().trim();

      const filtered = allScans.filter(s => {
        const matchFilter = currentFilter === 'all' || (s.tipo && s.tipo.includes(currentFilter));
        const textToSearch = `${s.codigo} ${s.nombre} ${s.composicion} ${s.tipo} ${s.raw}`.toLowerCase();
        const matchQuery = !query || textToSearch.includes(query);
        return matchFilter && matchQuery;
      });

      if (filtered.length === 0) {
        body.innerHTML = `<tr><td colspan="6" style="text-align: center; color: var(--text-muted); padding: 30px;">No hay lecturas registradas aún. Abre la app en el celular y presiona "Sincronizar".</td></tr>`;
        return;
      }

      body.innerHTML = filtered.map(s => {
        let tagClass = 'tag-otro';
        if (s.tipo && s.tipo.includes('OPERATIVA')) tagClass = 'tag-operativa';
        if (s.tipo && s.tipo.includes('IDENTIDAD')) tagClass = 'tag-identidad';
        if (s.tipo && s.tipo.includes('CONDICIONADA')) tagClass = 'tag-condicionada';

        return `
          <tr>
            <td><strong style="color: #fff; font-family: var(--font-heading); font-size: 1rem;">${s.codigo || '—'}</strong></td>
            <td><span class="tag-type ${tagClass}">${s.tipo || 'DESCONOCIDO'}</span></td>
            <td>
              <div style="font-weight: 600; color: #fff;">${escapeHtml(s.nombre || s.raw)}</div>
              ${s.notas ? `<small style="color: var(--text-muted);">${escapeHtml(s.notas)}</small>` : ''}
            </td>
            <td>
              <div style="font-size: 0.83rem;">${escapeHtml(s.composicion || s.detalles || '—')}</div>
              ${s.corrida ? `<small style="color: var(--accent-secondary);">${escapeHtml(s.corrida)}</small>` : ''}
            </td>
            <td><small style="color: var(--text-muted);">${escapeHtml(s.epp || '—')}</small></td>
            <td><small style="color: var(--text-subtle);">${s.date || new Date(s.timestamp).toLocaleString()}</small></td>
          </tr>
        `;
      }).join('');
    }

    function exportCSV() {
      if (allScans.length === 0) {
        alert("No hay datos para exportar.");
        return;
      }

      let csv = "ID,Codigo,Tipo,Nombre,Corrida,Composicion,EPP,Fecha,Raw\n";
      allScans.forEach(s => {
        csv += `"${s.id}","${s.codigo || ''}","${s.tipo || ''}","${(s.nombre || '').replace(/"/g, '""')}","${s.corrida || ''}","${(s.composicion || '').replace(/"/g, '""')}","${(s.epp || '').replace(/"/g, '""')}","${s.date || ''}","${(s.raw || '').replace(/"/g, '""')}"\n`;
      });

      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `censo_indupox_lecturas_${Date.now()}.csv`;
      a.click();
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
      });
    }
  </script>
</body>
</html>
